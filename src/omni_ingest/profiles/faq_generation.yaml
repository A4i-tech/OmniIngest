pipeline_id: faq_generation
parameters:
  properties:
    prompt:
      type: string
      default: "Generate 3-5 frequently asked questions and answers based on the following text."
steps:
  - agent: extract
    config:
      foreach: "."
      input: '[.items[:5][] | .text[:1000]] | join("\n")'
      path: ".metadata.faqs"
      prompt: "${.config.prompt}"
      schema:
        type: array
        items:
          type: object
          properties:
            q:
              type: string
              description: The question
            a:
              type: string
              description: The answer
          required: [q, a]
