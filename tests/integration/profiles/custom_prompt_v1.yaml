pipeline_id: custom_prompt_v1
domain_profile: health
input_modality: document
description: "Medical-focused pipeline with custom enrichment prompts"
steps:
  - agent: text
  - agent: chunking
  - agent: structure
    config:
      method: update
      prompt: "As a medical expert, summarize this clinical text for a patient. Identify medical terms as tags. Return JSON with 'patient_summary' and 'medical_tags'.\n\n{text}"
      json_schema:
        type: object
        properties:
          patient_summary:
            type: string
          medical_tags:
            type: array
            items:
              type: string
        required: [patient_summary, medical_tags]
  - agent: embedding
  - agent: indexing
