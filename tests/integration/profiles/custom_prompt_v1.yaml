pipeline_id: custom_prompt_v1
domain_profile: health
input_modality: document
description: "Medical-focused pipeline with custom enrichment prompts"
steps:
  - agent: chunking
  - agent: enrichment
    config:
      prompt_template: "As a medical expert, summarize this clinical text for a patient. Identify medical terms as tags. Return JSON with 'patient_summary' and 'medical_tags'.\n\n{text}"
      response_format: "json_object"
  - agent: embedding
  - agent: indexing
