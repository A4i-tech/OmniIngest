pipeline_id: audio_v2
domain_profile: accessibility
input_modality: audio
description: "Advanced audio pipeline with transcription post-processing"
steps:
  - agent: text
  - agent: prompt
    config:
      prompt: "Improve this transcript by fixing punctuation and common speech-to-text errors. Output only improved text."
      input: .items | map(.text) | join("\n")
      path: .metadata.transcript
  - agent: timed_chunking
    config:
      segment_duration: 60
  - agent: enrichment
  - agent: embedding
  - agent: ingestion_logger
