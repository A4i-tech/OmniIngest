pipeline_id: audio_v1
domain_profile: accessibility
input_modality: audio
description: "Accessibility-focused audio pipeline with Azure Speech transcription and timed segments"
steps:
  - agent: audio_parser
  - agent: timed_chunking
    config:
      segment_duration_ms: 30000
  - agent: enrichment
    config:
      provider: "openai"
      model: "gpt-4o"
  - agent: embedding
    config:
      provider: "openai"
      model: "text-embedding-3-small"
  - agent: indexing
    config:
      vector_store_kind: lancedb
