pipeline_id: noisy_v1
domain_profile: generic
input_modality: document
description: "Pipeline optimized for noisy/boilerplate HTML and poor formatting"
steps:
  - agent: text
  - agent: prompt
    config:
      prompt: "Extract only core lesson content. Remove navigation, footers, and adverts. Output only cleaned Markdown."
      input: .items | map(.text) | join("\n")
      path: .metadata.cleaned_markdown
  - agent: quality
    config:
      prompt_template: "Verify if this cleaned content is readable and coherent. Return JSON with 'overall_score' and 'issues'."
  - agent: embedding
