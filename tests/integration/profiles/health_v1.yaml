pipeline_id: health_v1
domain_profile: health
input_modality: document
description: "Healthcare-focused pipeline for knowledge base ingestion with deduplication focus"
steps:
  - agent: document_parser
  - agent: text_parser
    config:
      strip_html: true
  - agent: chunking
    config:
      chunk_size: 512
      overlap: 50
  - agent: enrichment
    config:
      model: "openai:gpt-5"
  - agent: embedding
    config:
      model: "openai:text-embedding-3-small"
  - agent: indexing
    config:
      vector_store_kind: lancedb
