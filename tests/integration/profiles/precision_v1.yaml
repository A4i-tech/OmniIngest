pipeline_id: precision_v1
domain_profile: generic
input_modality: document
description: "High-precision pipeline with small chunks and large embedding dimensions"
steps:
  - agent: document_parser
  - agent: chunking
    config:
      chunk_size: 256
      overlap: 25
  - agent: embedding
    config:
      model: "text-embedding-3-large"
      dimensions: 1024
      batch_size: 10
  - agent: indexing
    config:
      vector_store_kind: lancedb
