[project]
name = "omni-ingest"
version = "0.1.0"
description = "Universal knowledge ingestion framework for multi-modal AI systems. Ingest documents, audio, and structured data into RAG-ready knowledge bases with domain-aware pipelines."
readme = "README.md"
authors = [
    {name = "A4i-tech"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "pytest-asyncio>=1.3.0",
    "PyYAML>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
    "fsspec>=2026.1.0",
    "adlfs>=2024.12.0",
    "qdrant-client>=1.16.2",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "lancedb>=0.26.1",
    "azure-cognitiveservices-speech>=1.47.0",
    "pytest-cov>=7.0.0",
    "pydantic-ai>=1.48.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
period-plan = "omni_ingest.flows.period_plan_generation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-n 2 -v --dist=loadfile --cov=src --cov-report=json"

[dependency-groups]
dev = [
    "pytest-xdist>=3.0.0",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "griffe-pydantic>=1.1.0",
]

[tool.ruff]
line-length = 240
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "docx.*",
    "pypdf.*",
    "lancedb.*",
    "pyarrow.*",
]
ignore_missing_imports = true
