[project]
name = "omni-ingest"
version = "0.1.0"
description = "Universal knowledge ingestion framework for multi-modal AI systems. Ingest documents, audio, and structured data into RAG-ready knowledge bases with domain-aware pipelines."
readme = "README.md"
authors = [
    {name = "A4i-tech"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "openai>=2.41.1",
    "PyYAML>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.50",
    "aiosqlite>=0.22.1",
    "aiohttp>=3.14.1",
    "fsspec>=2026.4.0",
    "adlfs>=2026.5.0",
    "qdrant-client>=1.18.0",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "lancedb>=0.33.0",
    "azure-cognitiveservices-speech>=1.50.0",
    "pydantic-ai>=1.107.0",
    "python-magic>=0.4.27",
    "datamodel-code-generator>=0.63.0",
]

[project.optional-dependencies]
storage = [
    "azure-search-documents>=12.0.0",
    "chromadb>=1.5.9",
    "neo4j>=6.2.0",
    "pymongo>=4.17.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-n 2 -v --dist=loadfile --cov=src --cov-report=json"

[tool.pytest_env]
METADATA_STORE = "sqlite+aiosqlite:///:memory:"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12.20260518",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "griffe-pydantic>=1.3.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
]

[tool.ruff]
line-length = 240
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "docx.*",
    "pypdf.*",
    "lancedb.*",
    "pyarrow.*",
]
ignore_missing_imports = true
