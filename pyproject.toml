[project]
name = "omni-ingest"
version = "0.1.2"
description = "Universal knowledge ingestion framework for multi-modal AI systems. Ingest documents, audio, and structured data into RAG-ready knowledge bases with domain-aware pipelines."
readme = "docs/README.md"
authors = [
    {name = "A4i-tech"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "PyYAML>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.50",
    "aiosqlite>=0.22.1",
    "fsspec>=2026.4.0",
    "fastmcp>=3.4.2",
    "adlfs>=2026.5.0",
    "qdrant-client>=1.18.0",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "python-docx>=1.2.0",
    "lancedb>=0.33.0",
    "azure-cognitiveservices-speech>=1.50.0",
    "azure-ai-translation-text>=2.0.0",
    "pydantic-ai-slim[openai]>=2.30.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "datamodel-code-generator>=0.63.0",
    "jq>=1.11.0",
    "jsonschema>=4.26.0",
    "logfire>=4.37.0",
    "rich>=15.0.0",
    "pymupdf>=1.27.2.3",
    "sqlmodel>=0.0.39",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-core[aio]>=1.41.0",
    "sarvamai>=0.1.30",
    "liblouis>=3.38.0; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://omniingest.onrender.com"
Source = "https://github.com/A4i-tech/OmniIngest"
Documentation = "https://omniingest.onrender.com"

[project.scripts]
omni-ingest = "omni_ingest.cli:main"

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]>=2.0.0"]
bedrock = ["pydantic-ai-slim[bedrock]>=2.0.0"]
cohere = ["pydantic-ai-slim[cohere]>=2.0.0"]
google = ["pydantic-ai-slim[google]>=2.0.0"]
groq = ["pydantic-ai-slim[groq]>=2.0.0"]
huggingface = ["pydantic-ai-slim[huggingface]>=2.0.0"]
mistral = ["pydantic-ai-slim[mistral]>=2.0.0"]
openrouter = ["pydantic-ai-slim[openrouter]>=2.0.0"]
sentence-transformers = ["pydantic-ai-slim[sentence-transformers]>=2.0.0"]
storage = [
    "azure-search-documents>=12.0.0",
    "chromadb>=1.5.9",
    "neo4j>=6.2.0",
    "pymongo>=4.17.0",
]
voyageai = ["pydantic-ai-slim[voyageai]>=2.0.0"]
xai = ["pydantic-ai-slim[xai]>=2.0.0"]

[tool.uv.sources]
liblouis = [
    { path = "dependencies/liblouis-3.38.0-py3-none-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux'" },
    { path = "dependencies/liblouis-3.38.0-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = ["src/omni_ingest/cli.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-n 2 -v --dist=loadfile --cov=src --cov-report=json"

[tool.pytest_env]
METADATA_STORE = "sqlite+aiosqlite:///:memory:"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12.20260518",
    "types-jsonschema>=4.26.0.20260518",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "griffe-pydantic>=1.3.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "html5lib>=1.1",
]

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "docx.*",
    "jq.*",
    "pypdf.*",
    "lancedb.*",
    "pyarrow.*",
    "louis.*",
]
ignore_missing_imports = true
