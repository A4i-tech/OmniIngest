pipeline_id: enrichment
parameters:
  properties:
    prompt:
      type: string
      default: "Analyze text and provide JSON summary/tags. Content: {text}"
steps:
  - agent: structure
    config:
      target: ".metadata += $output"
      prompt: "${.config.prompt}"
      json_schema:
        type: object
        properties:
          summary:
            type: string
          tags:
            type: array
            items:
              type: string
        required: [summary, tags]
