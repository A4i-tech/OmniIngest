pipeline_id: enrichment
parameters:
  properties:
    prompt:
      type: string
      default: "Analyze text and provide JSON summary/tags."
steps:
  - agent: extract
    config:
      foreach: '.items[] | select(.text != null)'
      path: ".metadata"
      prompt: "${.config.prompt}"
      schema:
        type: object
        properties:
          summary:
            type: string
          tags:
            type: array
            items:
              type: string
        required: [summary, tags]
