pipeline_id: sentence_chunking
domain_profile: default
input_modality: document
description: Splits text items into chunks under a character limit. Breaks at line boundaries, then hard-cuts overlong lines. Has no overlap and no sentence detection.
parameters:
  properties:
    chunk_size:
      type: integer
      minimum: 1
      default: 1024
      description: Maximum characters per chunk.
steps:
  - agent: transform
    description: Split each text item into chunks
    config:
      update: [items]
      value: >
        def lines: split("\n") | length as $k | [to_entries[] | .value + (if .key < $k - 1 then "\n" else "" end) | select(. != "")];
        def hard($n): if length > $n then [range(0; length; $n) as $i | .[$i:$i+$n]] else [.] end;
        .items |= [
          .[] as $item
          | if $item.text == null then $item else
            [ $item.text | lines[] | hard(${.config.chunk_size})[] ] as $pieces
            | [ foreach ($pieces[], null) as $p ({cur: "", out: null};
                if $p == null then {cur: "", out: .cur}
                elif (.cur | length) > 0 and ((.cur | length) + ($p | length)) > ${.config.chunk_size} then {cur: $p, out: .cur}
                else {cur: (.cur + $p), out: null}
                end;
                .out | select(. != null and . != ""))
              ][] as $c
            | $item | del(.id) | .text = $c
            end
        ]
