- subtopic: "4.1 Magnetic and Non-magnetic Materials"
  description: |
    The magnets used by sailors in the olden days were based on naturally occurring magnets, known as lodestones which were discovered in ancient times. Later on, people found out that magnets could also be made from pieces of iron. Nowadays, we have magnets made of different materials. The magnets that you find in your school laboratory and those used in pencil boxes, stickers, toys are all artificial magnets (Fig. 4.1). The magnets can be of various shapes, some of which are shown in Fig. 4.2.

    **Do magnets stick to objects made of certain materials only?** Through this activity, we found out that some of the objects were attracted to the magnet and stuck to it, while others were not. The materials which are attracted towards a magnet are called **magnetic materials**. The metal iron is a magnetic material. Nickel and cobalt are other metals that are also magnetic. Some of their combinations with other metals are also attracted towards magnets. The materials which are not attracted towards a magnet are called **non-magnetic materials**.

- subtopic: "4.2 Poles of Magnet"
  description: |
    We find that maximum iron filings stick near the ends of the bar magnet, as shown in Fig. 4.4, while very few iron filings stick at the remaining part of the magnet. These ends of the magnet are called the two poles of the magnet—the **North pole** and the **South pole**. Most of the iron filings stick to the poles of a magnet of any shape. It is not possible to obtain a magnet with a single pole. If a magnet is broken into smaller pieces, North and South poles always exist in pairs even in the smallest piece of the magnet. A single North pole or a South pole cannot exist.

    *Can we find a magnet with a single pole?*

- subtopic: "4.3 Finding Directions"
  description: |
    A freely suspended magnet comes to rest along the north–south direction. The end of the magnet that points towards the north direction is called the North‑seeking pole or the **North pole of the magnet**. The other end that points towards the south direction is called the South‑seeking pole or the **South pole of the magnet**. A freely suspended magnet rests along the north–south direction because our Earth itself behaves like a giant magnet.

    Repeat this activity with a small iron bar in place of the bar magnet. What do you observe? Does it always rest along the north–south direction? It does not. It can rest along any direction. This implies that only magnets rest along the north–south direction. This activity provides us with a way to test whether a piece of metal is a magnet or not. The property of a freely suspended magnet to always rest along the north–south direction is used to find directions.

    Based on this, a small device called a magnetic compass was developed in olden days for finding directions. It has a magnet in the shape of a needle which can rotate freely (Fig. 4.6). The needle of a magnetic compass indicates the north–south direction. The compass is kept at the place where we wish to know the directions. After some time, the needle comes to rest in the north–south direction. The compass box is then gently rotated until the north and south marked on the dial are aligned with the needle. Now all directions at that place are as indicated on the dial. A magnetic compass is usually a small circular box with a transparent cover on it, as shown in Fig. 4.6. The magnet, in the shape of a needle, is mounted on a pin standing on the bottom of the box. This needle is balanced on the pin in such a manner that it can move around this point easily, that is, it can rotate freely. The end of the needle which rests in the north direction is usually painted red. Below the needle, there is a dial with directions marked on it.

    **How can we make our own magnetic compass?**

- subtopic: "4.4 Attraction and Repulsion between Magnets"
  description: |
    You will see that unlike poles of two magnets, that is, the North pole of one magnet and the South pole of another magnet, attract each other. The like poles, that is, either the North poles or the South poles of both magnets, repel each other. From this activity, we find that a magnet can be identified by its property of repulsion.

    When the North pole of a magnet is brought closer to the North pole of the compass needle, it moves away as shown in Fig. 4.9a. When the South pole of the magnet is brought closer to the North pole of the compass needle, it moves closer (Fig. 4.9b).

    *Suppose we place a piece of wood between the compass needle and the magnet. Will this affect the deflection of the compass needle?*

- subtopic: "4.5 Fun with Magnets"
  description: |
    After learning about magnets, Reshma was excited and decided to set up some fun activities using magnets at her school fair. You may try making these yourself and may also think of some more fun ideas.

    **Can we make a garland?** (Fig. 4.11) "Magnets can move some objects without touching them! Is that not amazing?"

    Can we take the steel balls out of the maze by moving a magnet below the cardboard tray? (Fig. 4.12)

    Can we pick out a steel paperclip fallen in water using a magnet, without getting our fingers or the magnet wet? (Fig. 4.13)

    Will the two cars speed towards each other or run away from each other when brought closer? (Fig. 4.14)

    In some magnets, the North and South poles are marked as **N** and **S**. In some other magnets, the North pole is indicated by a white dot. Sometimes, the North pole of a magnet is painted red and the South pole is painted blue.
