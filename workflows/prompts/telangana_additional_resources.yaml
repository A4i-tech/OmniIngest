  - id: section_question_bank
    title: Question Bank
    description: |
      Generate a comprehensive question bank that includes:

      • Multiple-choice questions (MCQs) with four options and one correct answer
      • Assessment questions requiring written responses

      For each of these difficulty levels:
      • Beginner: Direct questions testing basic knowledge and fundamental concepts
      • Intermediate: Questions requiring deeper understanding and application in familiar contexts
      • Advanced: Questions challenging students to analyze, evaluate and apply concepts in new contexts

      Requirements:
      • 5 MCQs and 5 assessment questions per difficulty level
      • All questions must align with the learning outcomes
      • Content should stay within textbook scope for the target grade
      • Use simple, clear vocabulary appropriate for students
      • Ensure equal coverage of all chapter topics
      • Do not include answers for assessment questions
