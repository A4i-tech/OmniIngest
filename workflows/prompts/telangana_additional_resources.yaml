        obtaining_materials: ""
        recap: ""

  - id: section_real_world_scenario
    title: Real-world Scenario
    description: |
      Generate thought-provoking real-world scenarios for each topic:
      • Cover each topic equally and align with all learning outcomes.
      • Provide scenarios at three levels—beginner, intermediate, advanced—using the same base example and extending complexity.
      • When relevant, customize scenarios to Karnataka’s north, south, and coastal regions, using regional context only where it enhances understanding of the topic.

      [Ensure all the above are feasible in low-resource Indian classrooms.]
