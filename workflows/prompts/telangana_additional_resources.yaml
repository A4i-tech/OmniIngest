_id: telangana-additional-resources
name: Telangana Period Plan Resources lesson plan
description: "Resource generation: Hands-on Activity, Real-world Scenario, Question Bank"
sections:
  - id: section_hands_on_activity
    title: Hands-on Activity
    description: |
      Generate engaging hands-on activities for the chapter:
      • Cover each topic equally and align each activity with all learning outcomes.
      • Include three activity types:
        1. Individual creative task that fosters practical application and expression.
        2. Collaborative activity for up to 30 students emphasizing teamwork and communication.
        3. Group activity for more than 30 students incorporating a competitive element.
      • Ensure every activity:
        - Facilitates student interaction and curiosity.
        - Directly addresses the relevant learning outcomes.
        - Captivates interest and is feasible in low-resource settings.

      [Ensure all the above are feasible in low-resource Indian classrooms.]
    mode: rag
    dependencies: []
    output_format:
