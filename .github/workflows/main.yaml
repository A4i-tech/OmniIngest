name: CI

on:
  push:
    branches:
      - a4i/main
      - a4i/staging
    tags:
      - 'v*'
  pull_request:
    branches:
      - a4i/main
      - a4i/staging
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run all tests'
        required: false
        type: boolean
        default: false
      deploy_docs:
        description: 'Deploy documentation'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check src

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev --extra storage
      - name: Run mypy
        run: uv run mypy src

  licenses:
    name: Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install runtime dependencies only
        run: uv sync --no-dev
      - name: Fail on strong-copyleft licences in core
        run: >
          uvx --from pip-licenses pip-licenses --python .venv/bin/python --from=mixed
          --partial-match --fail-on="GPL;General Public;Affero;SSPL"
          --format=markdown --output-file licenses.md
      - name: Upload licence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: licenses.md

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'a4i/main' || github.base_ref == 'a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest tests/unit

  verify-docs:
    name: Verify Documentation Build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'a4i/staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run mkdocs build
        run: uv run mkdocs build
      - name: Upload Documentation Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/
          retention-days: 7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_tests) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging'))
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    outputs:
      coverage-pct: ${{ steps.coverage.outputs.coverage-pct }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev --extra storage
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg
      - name: Run all tests
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_TRANSLATION_KEY: ${{ secrets.AZURE_TRANSLATION_KEY }}
          AZURE_TRANSLATION_REGION: ${{ vars.AZURE_TRANSLATION_REGION }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          DEFAULT_CHAT_COMPLETION_MODEL: ${{ vars.DEFAULT_CHAT_COMPLETION_MODEL }}
          DEFAULT_EMBEDDING_MODEL: ${{ vars.DEFAULT_EMBEDDING_MODEL }}
          DOCUMENTINTELLIGENCE_ENDPOINT: ${{ vars.DOCUMENTINTELLIGENCE_ENDPOINT }}
          DOCUMENTINTELLIGENCE_API_KEY: ${{ secrets.DOCUMENTINTELLIGENCE_API_KEY }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MISTRAL_OCR_API_KEY: ${{ secrets.MISTRAL_OCR_API_KEY }}
          MISTRAL_OCR_ENDPOINT: ${{ vars.MISTRAL_OCR_ENDPOINT }}
        run: uv run pytest
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered' coverage.json | awk '{print int($1+0.999)}')
          echo "coverage-pct=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"
      - name: Upload coverage badge
        if: ${{ vars.COVERAGE_GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: omni_ingest.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage-pct }}%
          color: ${{ steps.coverage.outputs.coverage-pct > 80 && 'brightgreen' || steps.coverage.outputs.coverage-pct > 60 && 'yellow' || 'red' }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_docs) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/main')
    needs: [lint, type-check, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force

  publish-release:
    name: Publish Release Package
    needs: [lint, type-check, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/a4i/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" ] || { echo "Tag ${GITHUB_REF_NAME} does not match the pyproject.toml version"; exit 1; }
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c "import re; p=open('pyproject.toml').read(); open('pyproject.toml','w').write(re.sub(r'^version = \".*?\"', f'version = \"$VERSION\"', p, flags=re.M))"
      - name: Build package
        run: uv build
      - name: Publish package to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Main Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true

