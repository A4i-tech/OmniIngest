name: CI

on:
  push:
    branches:
      - a4i/main
      - a4i/staging
  pull_request:
    branches:
      - a4i/main
      - a4i/staging
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run all tests'
        required: false
        type: boolean
        default: false
      deploy_docs:
        description: 'Deploy documentation'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run ruff
        run: uv run ruff check src

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run mypy
        run: uv run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run unit tests
        run: uv run pytest tests/unit

  verify-docs:
    name: Verify Documentation Build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'a4i/staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run mkdocs build
        run: uv run mkdocs build
      - name: Upload Documentation Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_tests) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging'))
    outputs:
      coverage-pct: ${{ steps.coverage.outputs.coverage-pct }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run all tests
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered' coverage.json | awk '{print int($1+0.999)}')
          echo "coverage-pct=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"
      - name: Upload coverage badge
        if: ${{ vars.COVERAGE_GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: omni_ingest.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage-pct }}%
          color: ${{ steps.coverage.outputs.coverage-pct > 80 && 'brightgreen' || steps.coverage.outputs.coverage-pct > 60 && 'yellow' || 'red' }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_docs) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/main')
    needs: [lint, type-check, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
