name: CI

on:
  push:
    branches:
      - a4i/main
      - a4i/staging
    tags:
      - 'v*'
  pull_request:
    branches:
      - a4i/main
      - a4i/staging
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run all tests'
        required: false
        type: boolean
        default: false
      deploy_docs:
        description: 'Deploy documentation'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check src

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev --extra storage
      - name: Run mypy
        run: uv run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'a4i/main' || github.base_ref == 'a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest tests/unit

  verify-docs:
    name: Verify Documentation Build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'a4i/staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging')
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run mkdocs build
        run: uv run mkdocs build
      - name: Upload Documentation Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/a4i/staging'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
          retention-days: 7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_tests) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging'))
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    outputs:
      coverage-pct: ${{ steps.coverage.outputs.coverage-pct }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev --extra storage
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg
      - name: Run all tests
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_TRANSLATION_KEY: ${{ secrets.AZURE_TRANSLATION_KEY }}
          AZURE_TRANSLATION_REGION: ${{ vars.AZURE_TRANSLATION_REGION }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          DEFAULT_CHAT_COMPLETION_MODEL: ${{ vars.DEFAULT_CHAT_COMPLETION_MODEL }}
          DEFAULT_EMBEDDING_MODEL: ${{ vars.DEFAULT_EMBEDDING_MODEL }}
          DOCUMENTINTELLIGENCE_ENDPOINT: ${{ vars.DOCUMENTINTELLIGENCE_ENDPOINT }}
          DOCUMENTINTELLIGENCE_API_KEY: ${{ secrets.DOCUMENTINTELLIGENCE_API_KEY }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          OCR_BASE_URL: ${{ vars.OCR_BASE_URL }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION }}
        run: uv run pytest
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered' coverage.json | awk '{print int($1+0.999)}')
          echo "coverage-pct=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"
      - name: Upload coverage badge
        if: ${{ vars.COVERAGE_GIST_ID != '' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: omni_ingest.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage-pct }}%
          color: ${{ steps.coverage.outputs.coverage-pct > 80 && 'brightgreen' || steps.coverage.outputs.coverage-pct > 60 && 'yellow' || 'red' }}

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_docs) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/a4i/main')
    needs: [lint, type-check, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force

  publish-release:
    name: Publish Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/a4i/main' || startsWith(github.ref, 'refs/tags/v')) && !contains(github.event.head_commit.message, '[skip ci]'))
    needs: [deploy-docs]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Bump version and tag
        id: bump_version
        run: |
          CURRENT=$(python -c "import re; p=open('pyproject.toml').read(); print(re.search(r'^version = \"(.*?)\"', p, flags=re.M).group(1))")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEWPATCH=$((PATCH + 1))
          NEWVERSION="$MAJOR.$MINOR.$NEWPATCH"
          python -c "import re; p=open('pyproject.toml').read(); open('pyproject.toml','w').write(re.sub(r'^version = \".*?\"', f'version = \"$NEWVERSION\"', p, flags=re.M))"
          echo "version=$NEWVERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to v$NEWVERSION [skip ci]"
          git push origin HEAD:a4i/main
          git tag "v$NEWVERSION"
          git push origin "v$NEWVERSION"
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -c "import re; p=open('pyproject.toml').read(); open('pyproject.toml','w').write(re.sub(r'^version = \".*?\"', f'version = \"$VERSION\"', p, flags=re.M))"
      - name: Build package
        run: uv build
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.bump_version.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.bump_version.outputs.version) }}
          prerelease: false
          generate_release_notes: true
      - name: Create or Update Rolling Latest Main Build Release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: latest
          name: Latest Main Build
          prerelease: true
          generate_release_notes: true

